name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Verify the app starts and serves a redirect
        run: |
          uvicorn main:app --port 8000 &
          for _ in $(seq 1 20); do
            curl -sf localhost:8000/health >/dev/null && break
            sleep 1
          done
          curl -sf localhost:8000/health
          CODE=$(curl -sf -X POST localhost:8000/api/shorten \
            -H 'Content-Type: application/json' \
            -d '{"original_url":"https://example.com/ci"}' \
            | python -c 'import sys,json; print(json.load(sys.stdin)["short_code"])')
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "localhost:8000/$CODE")
          test "$STATUS" = "302" || { echo "expected 302, got $STATUS"; exit 1; }
        env:
          DATABASE_URL: sqlite:///./ci.db
